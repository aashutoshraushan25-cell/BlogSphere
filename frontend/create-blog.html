<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog - BlogSphere</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-feather" style="color: var(--primary-color);"></i> BlogSphere</a>
            
            <button class="mobile-menu-btn" aria-label="Toggle Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li class="guest-link"><a href="login.html">Login</a></li>
                <li class="guest-link"><a href="register.html" class="btn btn-primary" style="color: white; padding: 0.5rem 1rem;">Register</a></li>
                
                <li class="auth-link" style="display: none;"><a href="dashboard.html">Dashboard</a></li>
                <li class="auth-link" style="display: none;"><a href="create-blog.html" class="active">Create Blog</a></li>
                <li class="auth-link" style="display: none;"><a href="profile.html">Profile</a></li>
                <li class="auth-link" style="display: none;"><a href="#" id="logoutBtn" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="section" style="padding-top: 2rem;">
        <div class="container">
            
            <div class="create-blog-container">
                <h1 class="mb-4">Create New Blog Post</h1>
                
                <form id="createBlogForm">
                    <div class="form-group">
                        <label for="title" class="form-label">Blog Title</label>
                        <input type="text" id="title" class="form-control" placeholder="Enter an engaging title..." required>
                    </div>

                    <div class="form-group">
                        <label for="category" class="form-label">Category</label>
                        <select id="category" class="form-control" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="web-development">Web Development</option>
                            <option value="mobile-apps">Mobile Apps</option>
                            <option value="artificial-intelligence">Artificial Intelligence</option>
                            <option value="education">Education</option>
                            <option value="career">Career Growth</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="image" class="form-label">Image URL (Optional)</label>
                        <input type="url" id="image" class="form-control" placeholder="https://example.com/image.jpg">
                    </div>
                    
                    <div class="form-group">
                        <label for="content" class="form-label">Content</label>
                        <textarea id="content" class="form-control" placeholder="Write your amazing content here..." required></textarea>
                        <span class="char-counter" id="charCounter">0 words | 0 characters</span>
                    </div>
                    
                    <div class="form-actions">
                        <a href="dashboard.html" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-primary">Publish Post</button>
                    </div>
                </form>
            </div>
            
        </div>
    </main>

    <!-- Footer -->
    <footer style="margin-top: auto;">
        <div class="container footer-content">
            <p class="footer-text text-center w-100">&copy; 2024 BlogSphere.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
